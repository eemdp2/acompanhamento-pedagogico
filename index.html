<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento Pedagógico</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>

<header>
<h1>📋 Acompanhamento Pedagógico</h1>
<p>Escola Estadual Militar Dom Pedro II</p>
</header>

<section class="painel">

<div class="topo">
<select id="turmaSelect"></select>
<button onclick="carregarTurma()">Abrir turma</button>
</div>

<div class="acoes">
<button onclick="copiarResumoTurma()">📱 Copiar resumo turma</button>

<input id="profPendencias" placeholder="Nome do professor">
<button onclick="copiarPendenciasProfessor()">📱 Pendências professor</button>

<button onclick="baixarImagem()">📥 Baixar imagem</button>
</div>

<div id="areaTurma"></div>

</section>

<script src="script.js"></script>
</body>
</html>
