<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Lançamentos - Firebase</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body{font-family:Arial;margin:20px;background:#f4f6f8}
    h1{text-align:center;margin:0}
    .topo{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:20px}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:20px}
    label{font-weight:bold;display:block;margin-top:10px}
    select,input,button{width:100%;padding:8px;margin-top:5px;border-radius:6px;border:1px solid #ccc}
    button{background:#b91c1c;color:#fff;border:none;cursor:pointer;margin-top:10px}
    button.sec{background:#2563eb}
    button.ok{background:#16a34a}
    button.warn{background:#ea580c}
    table{width:100%;border-collapse:collapse;margin-top:15px}
    th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
    tr.ok{background:#ecfdf5}
    tr.pend{background:#fef2f2}
    .status{cursor:pointer;font-weight:bold}
    .editBtn{background:#2563eb;margin-top:0}
    #statusConexao { text-align: center; font-weight: bold; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="statusConexao">🔄 Verificando conexão Firebase...</div>

<div class="topo">
  <img src="brasao-escola.jpeg" height="70">
  <div>
    <h1>Painel de Lançamentos</h1>
    <div><b>Escola Estadual Militar Dom Pedro II</b></div>
  </div>
</div>

<div class="card">
  <h2>Pendências por professor (todas as turmas)</h2>
  <input id="profPendencias" placeholder="Digite o nome do professor">
  <button class="sec" onclick="copiarPendenciasProfessor()">Copiar pendências do professor</button>
<button class="warn" onclick="varreduraGeral()">📋 Gerar Lista Geral de Professores</button>
                                                                                            
</div>

<div class="card" id="areaTurma">
  <h2>Abrir turma</h2>

  <label>Ano</label>
  <select id="ano"></select>

  <label>Turma</label>
  <select id="turma"></select>

  <button onclick="abrirTurma()">Abrir</button>
  <button class="ok" onclick="copiarResumoTurma()">Copiar resumo da turma</button>
  <button class="warn" onclick="baixarImagem()">Baixar imagem</button>

  <table>
    <thead>
      <tr>
        <th>Disciplina</th>
        <th>Professor</th>
        <th>Status</th>
        <th>Editar</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
// ===============================
// CONFIGURAÇÃO FIREBASE
// ===============================
const firebaseConfig = {
    apiKey: "AIzaSyDliIAcOCvgChv68cog27jenACkpF8MCyg",
    authDomain: "acompanhamento-pedagogico2026.firebaseapp.com",
    databaseURL: "https://acompanhamento-pedagogico2026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "acompanhamento-pedagogico2026",
    storageBucket: "acompanhamento-pedagogico2026.appspot.com",
    messagingSenderId: "G-N0Z5CZHEXK",
    appId: "1:358848317719:web:42feccdc979a1776cc8f52"
};

// Inicializa Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Monitor de Conexão
const statusDiv = document.getElementById("statusConexao");
db.ref(".info/connected").on("value", snap => {
  if (snap.val() === true) {
    statusDiv.innerHTML = "🟢 Firebase conectado";
    statusDiv.style.color = "#16a34a";
    statusDiv.style.background = "#dcfce7";
  } else {
    statusDiv.innerHTML = "🔴 Firebase desconectado";
    statusDiv.style.color = "#dc2626";
    statusDiv.style.background = "#fee2e2";
  }
});

// ===============================
// LÓGICA DO SISTEMA
// ===============================
const turmasBase = {"6º":["A","B","C","D","E"],"7º":["A","B","C","D","E","F"]};
const disciplinasBase = ["Língua Portuguesa","Arte","Educação Física","Inglês","Matemática","Ciências","História","Geografia"];

window.onload = function(){
  const anoSel = document.getElementById("ano");
  Object.keys(turmasBase).forEach(a => {
    const op = document.createElement("option");
    op.textContent = a;
    anoSel.appendChild(op);
  });
  carregarTurmas();
};

document.getElementById("ano").addEventListener("change", carregarTurmas);

function carregarTurmas(){
  const ano = document.getElementById("ano").value;
  const turmaSel = document.getElementById("turma");
  turmaSel.innerHTML = "";
  turmasBase[ano].forEach(t => {
    const op = document.createElement("option");
    op.textContent = t;
    turmaSel.appendChild(op);
  });
}

function abrirTurma(){
  const ano = document.getElementById("ano").value;
  const turma = document.getElementById("turma").value;
  const chave = "status_" + ano + turma;

  db.ref("turmas/" + chave).on("value", snap => { // Usei .on para atualizar em tempo real
    let dados = snap.val();

    if(!dados){
      dados = disciplinasBase.map(d => ({
        ano, turma, disciplina: d, professor: "", ok: false
      }));
      db.ref("turmas/" + chave).set(dados);
    }
    renderTabela(dados, chave);
  });
}

function renderTabela(dados, chave){
  const tb = document.getElementById("tabela");
  tb.innerHTML = "";

  dados.forEach((d, i) => {
    const tr = document.createElement("tr");
    tr.className = d.ok ? "ok" : "pend";

    tr.innerHTML = `
      <td>${d.disciplina}</td>
      <td>${d.professor || "—"}</td>
      <td class="status" onclick="toggleStatus('${chave}',${i})">${d.ok ? "OK" : "PENDENTE"}</td>
      <td><button class="editBtn" onclick="editarProf('${chave}',${i})">Editar</button></td>
    `;
    tb.appendChild(tr);
  });
}

function toggleStatus(chave, i){
  const ref = db.ref("turmas/" + chave + "/" + i + "/ok");
  ref.once("value").then(snap => {
    ref.set(!snap.val());
  });
}

function editarProf(chave, i){
  const ref = db.ref("turmas/" + chave + "/" + i);
  ref.once("value").then(snap => {
    const d = snap.val();
    const nome = prompt("Nome do professor:", d.professor || "");
    if(nome !== null){
      ref.update({ professor: nome.trim() });
    }
  });
}

function copiarTexto(txt){
  navigator.clipboard.writeText(txt).then(() => alert("Copiado 👍"));
}

function copiarResumoTurma(){
  const ano = document.getElementById("ano").value;
  const turma = document.getElementById("turma").value;
  const chave = "status_" + ano + turma;

  db.ref("turmas/" + chave).once("value").then(snap => {
    const dados = snap.val() || [];
    let txt = `Escola Estadual Militar Dom Pedro II\nTurma ${ano} ${turma}\n\n`;
    dados.forEach(d => {
      txt += `${d.disciplina} — ${d.professor || "(sem prof)"} — ${d.ok ? "OK" : "PENDENTE"}\n`;
    });
    copiarTexto(txt);
  });
}

function copiarPendenciasProfessor(){
  const prof = document.getElementById("profPendencias").value.trim();
  if(!prof){ alert("Digite o nome"); return; }

  db.ref("turmas").once("value").then(snap => {
    const turmas = snap.val() || {};
    let txt = `Pendências do professor ${prof}\n\n`;
    let achou = false;

    Object.values(turmas).forEach(lista => {
      lista.forEach(d => {
        if(d.professor && d.professor.toLowerCase() === prof.toLowerCase() && !d.ok){
          txt += `${d.ano} ${d.turma} — ${d.disciplina}\n`;
          achou = true;
        }
      });
    });

    if(!achou){ alert("Nenhuma pendência encontrada para este professor."); return; }
    copiarTexto(txt);
  });
}

function baixarImagem(){
  html2canvas(document.getElementById("areaTurma")).then(canvas => {
    const link = document.createElement("a");
    link.download = "turma.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
