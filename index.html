<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Lançamentos</title>
  <style>
    body { font-family: Arial; margin:20px; background:#f4f6f8 }
    h1 { text-align:center }
    .topo { display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:20px }
    .card { background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:20px }
    label { font-weight:bold;display:block;margin-top:10px }
    select,input,button { width:100%;padding:8px;margin-top:5px;border-radius:6px;border:1px solid #ccc }
    button { background:#b91c1c;color:#fff;border:none;cursor:pointer;margin-top:10px }
    .listas { display:flex;gap:20px;margin-top:15px }
    .col { flex:1;padding:10px;border-radius:8px }
    .col.lancaram { background:#ecfdf5;border:1px solid #22c55e }
    .col.nao { background:#fef2f2;border:1px solid #ef4444 }
    .badge { font-size:12px;padding:2px 6px;border-radius:6px;margin-left:6px }
    .b-ok { background:#22c55e;color:#fff }
    .b-pend { background:#ef4444;color:#fff }
    .hidden { display:none }
  </style>
</head>
<body>

<div class="topo">
  <img src="brasao-escola.jpeg" height="70">
  <div>
    <h1>Painel de Lançamentos</h1>
    <div><b>Escola Estadual Militar Dom Pedro II</b></div>
  </div>
</div>

<!-- LOGIN -->
<div class="card" id="loginCard">
  <h2>Login</h2>
  <label>Usuário</label>
  <input id="user">
  <label>Perfil</label>
  <select id="perfil">
    <option value="coord">Coordenador</option>
    <option value="prof">Professor</option>
  </select>
  <button onclick="login()">Entrar</button>
</div>

<!-- CADASTRO FIXO -->
<div class="card hidden" id="cadastroCard">
  <h2>Cadastro fixo da turma</h2>
  <label>Ano</label>
  <select id="cadAno"><option>6º</option><option>7º</option></select>
  <label>Turma</label>
  <select id="cadTurma"></select>
  <label>Disciplina</label>
  <select id="cadDisc">
    <option>Língua Portuguesa</option><option>Arte</option><option>Educação Física</option>
    <option>Inglês</option><option>Matemática</option><option>Ciências</option>
    <option>História</option><option>Geografia</option>
  </select>
  <label>Professor</label>
  <input id="cadProf">
  <button onclick="salvarCadastro()">Salvar</button>
</div>

<!-- PAINEL TURMA -->
<div class="card hidden" id="painelCard">
  <h2>Abrir turma</h2>
  <label>Ano</label>
  <select id="ano"><option>6º</option><option>7º</option></select>
  <label>Turma</label>
  <select id="turma"></select>
  <label>Semana</label>
  <input type="week" id="semana">
  <label>Filtrar disciplina</label>
  <select id="filtroDisc" onchange="abrirTurma()">
    <option value="">Todas</option>
    <option>Língua Portuguesa</option><option>Arte</option><option>Educação Física</option>
    <option>Inglês</option><option>Matemática</option><option>Ciências</option>
    <option>História</option><option>Geografia</option>
  </select>
  <button onclick="abrirTurma()">Abrir</button>
  <button onclick="baixarImagem()">Baixar imagens</button>
  <button onclick="exportarPDF()">Exportar PDF</button>

  <div style="margin-top:10px">
    <div style="font-size:12px">Progresso</div>
    <div style="background:#e5e7eb;border-radius:6px;height:14px">
      <div id="barraProg" style="height:100%;width:0%;background:#22c55e"></div>
    </div>
  </div>

  <div class="listas">
    <div class="col lancaram">
      <h3>Quem lançou <span id="contLanc" class="badge b-ok"></span></h3>
      <div id="listaLancaram"></div>
    </div>
    <div class="col nao">
      <h3>Quem não lançou <span id="contNao" class="badge b-pend"></span></h3>
      <div id="listaNaoLancaram"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD GERAL -->
<div class="card hidden" id="geralCard">
  <h2>Painel geral da escola</h2>
  <button onclick="gerarResumo()">Atualizar</button>
  <div id="resumo"></div>
</div>

<script>
const turmas6=["A","B","C","D","E"];
const turmas7=["A","B","C","D","E","F"];

const cadAno=document.getElementById("cadAno");
const cadTurma=document.getElementById("cadTurma");
const ano=document.getElementById("ano");
const turma=document.getElementById("turma");
const semana=document.getElementById("semana");
const cadDisc=document.getElementById("cadDisc");
const cadProf=document.getElementById("cadProf");

function preencher(selectAno,selectTurma){
  const lista = selectAno.value==="6º"?turmas6:turmas7;
  selectTurma.innerHTML="";
  lista.forEach(t=>{
    const o=document.createElement("option");
    o.value=t; o.textContent=t;
    selectTurma.appendChild(o);
  });
}
preencher(cadAno,cadTurma);
preencher(ano,turma);
cadAno.onchange=()=>preencher(cadAno,cadTurma);
ano.onchange=()=>preencher(ano,turma);

function login(){
  const perfil=document.getElementById("perfil").value;
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("painelCard").classList.remove("hidden");
  document.getElementById("geralCard").classList.remove("hidden");
  if(perfil==="coord") document.getElementById("cadastroCard").classList.remove("hidden");
}

function salvarCadastro(){
  const base=JSON.parse(localStorage.getItem("baseTurma")||"[]");
  base.push({ano:cadAno.value,turma:cadTurma.value,disc:cadDisc.value,prof:cadProf.value});
  localStorage.setItem("baseTurma",JSON.stringify(base));
  alert("Salvo");
}

function abrirTurma(){
  const base=JSON.parse(localStorage.getItem("baseTurma")||"[]")
    .filter(b=>b.ano===ano.value && b.turma===turma.value);
  const lanc=JSON.parse(localStorage.getItem("lanc")||"[]");
  const filtro=document.getElementById("filtroDisc").value;

  let cL=0,cN=0,htmlL="",htmlN="";

  base.forEach(b=>{
    if(filtro && b.disc!==filtro) return;
    const reg=lanc.find(l=>l.ano===ano.value && l.turma===turma.value && l.disc===b.disc && l.sem===semana.value);
    if(reg && reg.status==="Realizado"){
      cL++;
      htmlL+=`<div>✔ ${b.disc} — ${b.prof} <button onclick="marcar('${b.disc}','Pendente')">Desmarcar</button></div>`;
    }else{
      cN++;
      htmlN+=`<div>❌ ${b.disc} — ${b.prof} <button onclick="marcar('${b.disc}','Realizado')">Marcar</button></div>`;
    }
  });

  const total=(cL+cN)||1;
  const perc=Math.round(cL*100/total);
  document.getElementById("barraProg").style.width=perc+"%";
  document.getElementById("contLanc").textContent=`${cL}/${total} (${perc}%)`;
  document.getElementById("contNao").textContent=`${cN}`;
  document.getElementById("listaLancaram").innerHTML=htmlL||"<em>Ninguém</em>";
  document.getElementById("listaNaoLancaram").innerHTML=htmlN||"<em>Todos</em>";
}

function marcar(disc,status){
  const arr=JSON.parse(localStorage.getItem("lanc")||"[]");
  const i=arr.findIndex(l=>l.ano===ano.value && l.turma===turma.value && l.disc===disc && l.sem===semana.value);
  if(i===-1) arr.push({ano:ano.value,turma:turma.value,disc,sem:semana.value,status});
  else arr[i].status=status;
  localStorage.setItem("lanc",JSON.stringify(arr));
  abrirTurma();
}

function baixarImagem() {
  const area = document.getElementById("painel-turma");

  // Clonar o painel para não alterar o original
  const clone = area.cloneNode(true);

  // Remover TODOS os elementos de ação (botões e barras vermelhas)
  clone.querySelectorAll("button, .botoes-acao, .acao, .btn, .marcar, .desmarcar").forEach(el => el.remove());

  // Garantir que nada interativo apareça
  clone.querySelectorAll("[onclick]").forEach(el => el.removeAttribute("onclick"));

  // Posicionar fora da tela para renderização limpa
  clone.style.position = "fixed";
  clone.style.left = "-9999px";
  clone.style.top = "0";
  document.body.appendChild(clone);

  html2canvas(clone, { backgroundColor: "#ffffff" }).then(canvas => {
    const data = new Date().toLocaleDateString().replace(/\//g, "-");
    const link = document.createElement("a");
    link.download = `acompanhamento_turma_${data}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();

    document.body.removeChild(clone);
  });
}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();

    // remover clone após exportação
    document.body.removeChild(clone);
  });
}.png`;
    link.href = canvas.toDataURL();
    link.click();

    // mostrar botões novamente
    botoes.forEach(b => b.style.display = "flex");
  });
}${turma.value}.png`;
    link.href=c.toDataURL();
    link.click();
  });
}

function exportarPDF(){
  html2canvas(document.getElementById("painelCard")).then(c=>{
    const link=document.createElement("a");
    link.download=`Relatorio_${ano.value}${turma.value}.pdf`;
    link.href=c.toDataURL();
    link.click();
  });
}

function gerarResumo(){
  const base=JSON.parse(localStorage.getItem("baseTurma")||"[]");
  const lanc=JSON.parse(localStorage.getItem("lanc")||"[]");
  const div=document.getElementById("resumo");
  let html="";

  [...new Set(base.map(b=>b.ano+b.turma))].forEach(t=>{
    const turmaBase=base.filter(b=>b.ano+b.turma===t);
    const total=turmaBase.length;
    const feitos=lanc.filter(l=>l.ano+l.turma===t && l.status==="Realizado").length;
    const perc=Math.round((feitos/(total||1))*100);
    html+=`<div><b>Turma ${t}</b> — ${perc}% lançamentos</div>`;
  });

  div.innerHTML=html;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
