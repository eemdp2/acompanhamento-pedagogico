<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ábaco Mobile Pro</title>
    <style>
        :root {
            --madeira: #704214;
            --metal: #aab;
            --unidade: #2ecc71;
            --dezena: #f1c40f;
            --centena: #e67e22;
            --milhar: #e74c3c;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            overflow: hidden; /* Evita rolagens desnecessárias */
            touch-action: manipulation; /* Melhora resposta ao toque */
        }

        .visor {
            background: #1a252f;
            color: #2ecc71;
            font-size: 2.5rem;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            font-family: monospace;
        }

        .abaco-frame {
            border: 10px solid var(--madeira);
            border-radius: 15px;
            background: #fff9f0;
            display: flex;
            justify-content: space-around;
            width: 95%;
            height: 65vh; /* Ocupa a maior parte da tela vertical */
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .coluna {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            position: relative;
        }

        .haste {
            position: absolute;
            width: 10px;
            height: 100%;
            background: linear-gradient(to right, #999, #ccc, #999);
            z-index: 1;
        }

        .contas-container {
            display: flex;
            flex-direction: column-reverse;
            justify-content: flex-start;
            height: 100%;
            width: 85%;
            z-index: 2;
            padding-bottom: 5px;
        }

        /* CONTAS MAIORES PARA O DEDO */
        .conta {
            width: 100%;
            height: 7%; /* Proporção ideal para 9 contas */
            min-height: 44px; /* Altura mínima recomendada para toque (Apple/Google) */
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            margin-bottom: 6px; /* Espaço maior entre as contas */
            border: 1px solid rgba(0,0,0,0.1);
        }

        .col-um .conta { background: var(--milhar); }
        .col-c  .conta { background: var(--centena); }
        .col-d  .conta { background: var(--dezena); }
        .col-u  .conta { background: var(--unidade); }

        /* Movimento de subida maior para clareza visual */
        .conta.active {
            transform: translateY(-28vh); 
        }

        .labels {
            display: flex;
            width: 95%;
            margin-top: 10px;
        }

        .label {
            flex: 1;
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .btn-reset {
            margin-top: auto;
            margin-bottom: 20px;
            width: 90%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 15px;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #962d22;
            active { transform: translateY(3px); box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="visor" id="resultado">0</div>

    <div class="abaco-frame">
        <div class="coluna col-um"><div class="haste"></div><div class="contas-container" id="um"></div></div>
        <div class="coluna col-c"><div class="haste"></div><div class="contas-container" id="c"></div></div>
        <div class="coluna col-d"><div class="haste"></div><div class="contas-container" id="d"></div></div>
        <div class="coluna col-u"><div class="haste"></div><div class="contas-container" id="u"></div></div>
    </div>

    <div class="labels">
        <div class="label">UM</div>
        <div class="label">C</div>
        <div class="label">D</div>
        <div class="label">U</div>
    </div>

    <button class="btn-reset" onclick="reset()">Zerar Ábaco</button>

    <script>
        const ordens = [
            { id: 'um', valor: 1000 },
            { id: 'c', valor: 100 },
            { id: 'd', valor: 10 },
            { id: 'u', valor: 1 }
        ];

        let total = 0;
        const visor = document.getElementById('resultado');

        ordens.forEach(ordem => {
            const container = document.getElementById(ordem.id);
            for(let i=0; i<9; i++) {
                const conta = document.createElement('div');
                conta.className = 'conta';
                // Adicionado 'touchstart' para resposta imediata no celular
                const handleEvent = (e) => {
                    e.preventDefault();
                    if (conta.classList.contains('active')) {
                        conta.classList.remove('active');
                        total -= ordem.valor;
                    } else {
                        conta.classList.add('active');
                        total += ordem.valor;
                    }
                    visor.innerText = total.toLocaleString('pt-BR');
                };
                
                conta.addEventListener('click', handleEvent);
                container.appendChild(conta);
            }
        });

        function reset() {
            document.querySelectorAll('.conta').forEach(c => c.classList.remove('active'));
            total = 0;
            visor.innerText = "0";
        }
    </script>
</body>
</html>
